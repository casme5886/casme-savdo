<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>CASME</title>
    <!-- Ijtimoiy tarmoq (Facebook/Instagram reklama, ulashish) oldindan
         ko'rish kartochkasi uchun — bu botlar saytning JS kodini
         ishga tushirmaydi, shuning uchun "sayt nomi" shu yerdagi statik
         qiymatdan olinadi (aks holda "Savdo Panel" kabi ko'rinib qolardi). -->
    <meta property="og:site_name" content="CASME" />
    <meta property="og:title" content="CASME — original kosmetika mahsulotlari" />
    <meta property="og:description" content="Original Koreya kosmetikasi qulay narxlarda." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://casme.uz" />
    <!-- Telegram Mini App SDK — Telegram ichida ochilganda window.Telegram.WebApp shu orqali keladi.
         "defer" qo'shildi: bu skript oddiy (async/defer'siz) holatda HTML
         o'qilishini to'xtatib turardi (barcha mijozlar uchun, Telegram
         ichida bo'lmasa ham) — endi sahifa parallel yuklanadi, tezroq
         ko'rinadi, ijro tartibi esa saqlanadi (chunki type="module"
         skriptlar ham avtomatik kechiktiriladi va hujjatdagi tartibda
         ishga tushadi). -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Do'kon sahifasidagi sarlavhalar uchun serif shrift -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Ma'lumotlar (Firestore) va rasmlar (Cloudflare R2) domenlariga
         oldindan ulanish — birinchi so'rov yuborilganda DNS/TLS
         qidiruviga sarflanadigan vaqtni tejaydi. -->
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://pub-6a37909dbe8741249b8e364db72918b6.r2.dev" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
