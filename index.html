<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>CASME — Original Koreys Kosmetikasi | O'zbekistonda</title>

    <!-- Qidiruv tizimlari uchun asosiy tavsif, robots ruxsati va canonical
         manzil. Mahsulot sahifasi ochilganda yoki til (uz/ru) almashtirilganda
         (src/App.jsx) bular JS orqali moslab yangilanadi; JS ishlamagan holatda
         (yoki JS ishga tushmasdan oldin, masalan ba'zi botlar uchun) shu bosh
         sahifa (o'zbekcha) qiymatlari ko'rinadi. -->
    <meta name="description" content="CASME — original Koreya kosmetikalari va teri parvarishi mahsulotlari. Akne, dog'lar, quruq va sezgir teri uchun mahsulotlar." />
    <meta name="keywords" content="casme, casme kosmetika, casme uz, original kosmetika, koreys kosmetikasi, koreys kosmetikasi uzbekistan, yuz uchun kosmetika, aknega qarshi kosmetika" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.casme.uz/" />

    <!-- Hreflang — sahifaning o'zbekcha va ruscha (?lang=ru) versiyalari bir
         xil URL ostida (SPA), lekin Google'ga ikkalasi ham mavjudligini va
         bir-birining TARJIMASI ekanini (dublikat emas) bildirish uchun.
         Mahsulot sahifalarida (src/App.jsx) shu teglar o'sha mahsulotning
         manziliga moslab qayta yoziladi. -->
    <link rel="alternate" hreflang="uz-UZ" href="https://www.casme.uz/" />
    <link rel="alternate" hreflang="ru-UZ" href="https://www.casme.uz/?lang=ru" />
    <link rel="alternate" hreflang="x-default" href="https://www.casme.uz/" />

    <!-- Favicon / site icon — do'kon logotipi. MUHIM: Google qidiruv
         natijalarida ikonka ko'rinishi uchun bu manzil saytning O'ZI bilan
         BIR domenda bo'lishi shart — shuning uchun to'g'ridan-to'g'ri R2'ga
         emas, "/favicon.ico" ga (u www.casme.uz orqali api/sitemap.js
         proksisiga yo'naladi — vercel.json'ga qarang) ishora qiladi.
         Brauzer tab'idagi ikonka esa Sozlamalar o'zgarganda JS orqali ham
         yangilanadi (src/App.jsx) — u yerda to'g'ridan-to'g'ri R2 manzili
         ishlatilaveradi, chunki bu cheklov faqat Google favicon'iga tegishli. -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />

    <!-- PWA (mobil ilova) — "Bosh ekranga qo'shish" orqali o'rnatilganda
         to'liq ekranli ilova ko'rinishida ochilishi uchun. manifest.webmanifest
         va servis worker ro'yxatdan o'tkazuvchi skript build vaqtida
         (vite-plugin-pwa) index.html'ga AVTOMATIK qo'shiladi — shuning
         uchun bu yerda faqat iOS Safari uchun maxsus teglar kerak (Apple
         hali <link rel="manifest">'ni to'liq qo'llab-quvvatlamaydi). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CASME" />

    <!-- Ijtimoiy tarmoq (Facebook/Instagram/Telegram/WhatsApp ulashish)
         oldindan ko'rish kartochkasi uchun — bu botlar ko'pincha saytning
         JS kodini ishga tushirmaydi, shuning uchun bu qiymatlar shu yerda
         STATIK holda ham kerak (JS ular ustidan qayta yozadi — src/App.jsx). -->
    <meta property="og:site_name" content="CASME" />
    <meta property="og:title" content="CASME — Original Koreys Kosmetikasi | O'zbekistonda" />
    <meta property="og:description" content="CASME — original Koreya kosmetikalari va teri parvarishi mahsulotlari. Akne, dog'lar, quruq va sezgir teri uchun mahsulotlar." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.casme.uz/" />
    <meta property="og:image" content="https://pub-6a37909dbe8741249b8e364db72918b6.r2.dev/settings/logo" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:locale:alternate" content="ru_UZ" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CASME — Original Koreys Kosmetikasi | O'zbekistonda" />
    <meta name="twitter:description" content="CASME — original Koreya kosmetikalari va teri parvarishi mahsulotlari. Akne, dog'lar, quruq va sezgir teri uchun mahsulotlar." />
    <meta name="twitter:image" content="https://pub-6a37909dbe8741249b8e364db72918b6.r2.dev/settings/logo" />

    <!-- Structured data (JSON-LD) — sayt bo'yicha bir xil bo'lgan sxemalar
         (Organization, WebSite). Mahsulotga BOG'LIQ sxemalar (Product,
         BreadcrumbList) mahsulot ochilganda src/App.jsx orqali dinamik
         qo'shiladi/olib tashlanadi. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CASME",
        "url": "https://www.casme.uz/",
        "logo": "https://pub-6a37909dbe8741249b8e364db72918b6.r2.dev/settings/logo",
        "sameAs": [
          "https://www.instagram.com/casme/",
          "https://t.me/casme_uz"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CASME",
        "url": "https://www.casme.uz/",
        "inLanguage": ["uz-UZ", "ru-UZ"]
      }
    </script>

    <!-- Telegram Mini App SDK — Telegram ichida ochilganda window.Telegram.WebApp shu orqali keladi.
         "defer" qo'shildi: bu skript oddiy (async/defer'siz) holatda HTML
         o'qilishini to'xtatib turardi (barcha mijozlar uchun, Telegram
         ichida bo'lmasa ham) — endi sahifa parallel yuklanadi, tezroq
         ko'rinadi, ijro tartibi esa saqlanadi (chunki type="module"
         skriptlar ham avtomatik kechiktiriladi va hujjatdagi tartibda
         ishga tushadi). -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Do'kon sahifasidagi sarlavhalar uchun serif shrift -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Ma'lumotlar (Firestore) va rasmlar (Cloudflare R2) domenlariga
         oldindan ulanish — birinchi so'rov yuborilganda DNS/TLS
         qidiruviga sarflanadigan vaqtni tejaydi. -->
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://pub-6a37909dbe8741249b8e364db72918b6.r2.dev" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <!-- TEZLIK: katalog ma'lumotini JS paketlari yuklanishini KUTMASDAN darhol
         so'raymiz va birinchi banner rasmini oldindan yuklashni boshlaymiz
         (LCP). Ilova (src/App.jsx) tayyor va'dani window.__catalogP dan oladi.
         Xato bo'lsa — jim o'tadi, ilova o'zi zaxira yo'lga o'tadi. -->
    <script>
      (function () {
        try {
          if (location.pathname.indexOf("/admin") === 0) return;
          var p = fetch("/api/catalog").then(function (r) {
            return r.ok ? r.json() : Promise.reject(new Error("catalog " + r.status));
          });
          window.__catalogP = p;
          p.then(function (d) {
            var R2 = "https://pub-6a37909dbe8741249b8e364db72918b6.r2.dev/";
            var today = new Date().toISOString().slice(0, 10);
            var list = (d.banners || [])
              .filter(function (b) {
                return b.active && !(b.startDate && today < b.startDate) && !(b.endDate && today > b.endDate);
              })
              .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
            var b = list[0];
            // Banner faqat bosh sahifada ko'rinadi — boshqa sahifalarda ortiqcha yuklamaymiz.
            if (!b || location.pathname !== "/") return;
            var narrow = window.innerWidth < 1024;
            var u = narrow ? b.mobileImage : b.desktopImage;
            if (typeof u !== "string" || u.indexOf(R2) !== 0) return;
            var href = "/product-image?src=" + encodeURIComponent(u) + "&raw=1&alpha=1&w=" + (narrow ? 900 : 1600);
            var l = document.createElement("link");
            l.rel = "preload"; l.as = "image"; l.href = href;
            l.setAttribute("fetchpriority", "high");
            document.head.appendChild(l);
          }).catch(function () {});
          p.catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
